AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lets GitHub Actions deploy paper.bible (.github/workflows/deploy.yml) with no stored AWS keys:
  a workflow on the main branch exchanges GitHub's OIDC token for DeployRole, which can push the
  server image, sync the app and update the app stack, the last only through CloudFormationRole.
  Deployed once by .bin/setup_ci_aws, apart from infra/cloudformation.yml, so the app stack's
  own deploys can never change the permissions they run with.

Parameters:
  Repository:
    Type: String
    Default: gracious-tech/paper
    Description: The GitHub repository (owner/name) allowed to deploy

  Branch:
    Type: String
    Default: main
    Description: The only branch whose workflows may assume DeployRole

  AppStack:
    Type: String
    Default: paper-bible
    Description: The app stack (infra/cloudformation.yml) this role deploys

  EcrRepository:
    Type: String
    Default: paper-bible

  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      An account can have only one GitHub OIDC provider. Left empty, this stack creates it;
      otherwise pass the existing one's ARN (.bin/setup_ci_aws detects it on first deploy).

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:

  # GitHub's token issuer. AWS verifies GitHub's tokens against its own trusted CAs these days,
  # but the thumbprints are still accepted, so they're given for older validation paths
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # What CloudFormation acts as when DeployRole updates the app stack. It has to be able to
  # create anything the template names (IAM roles, Lambda, CloudFront...), so it's an admin —
  # but only CloudFormation can assume it, and only DeployRole (and account admins) can hand it
  # over, so its reach is whatever infra/cloudformation.yml on main describes
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppStack}-cloudformation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # What the deploy workflow runs as
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppStack}-github-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider,
                !Ref ExistingOidcProviderArn]
            Action: [sts:AssumeRoleWithWebIdentity, sts:TagSession]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  !Sub 'repo:${Repository}:ref:refs/heads/${Branch}'
      Policies:
        # Deploying the app stack, only ever through CloudFormationRole
        - PolicyName: cloudformation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AppStack}/*'
              - Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
        # Pushing the server image (.bin/push_server_lambda), plus the checks .bin/deploy_aws
        # makes before deploying (that the repo and its placeholder image exist)
        - PolicyName: ecr
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: !Sub 'arn:aws:ecr:*:${AWS::AccountId}:repository/${EcrRepository}'
        # Shipping the app (.bin/deploy_app): the site bucket (its sourcemaps/ archive included)
        # and the CloudFront invalidation. The bucket name follows infra/cloudformation.yml's
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${AppStack}-site-${AWS::AccountId}'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:aws:s3:::${AppStack}-site-${AWS::AccountId}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'
        # .bin/deploy_aws finds the site's certificate before deploying
        - PolicyName: certificate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [acm:ListCertificates, acm:DescribeCertificate]
                Resource: '*'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: The AWS_DEPLOY_ROLE_ARN repository variable

  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
    Description: The AWS_CFN_ROLE_ARN repository variable
