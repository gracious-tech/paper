AWSTemplateFormatVersion: '2010-09-09'
Description: >
  paper.bible hosting + API — S3/CloudFront for the static app, Lambda + API Gateway for the
  server (light + compile roles, one container image). Firestore/Auth/Storage stay on Firebase
  — this stack only owns what moved to AWS. Deployed entirely in one region (see .bin/deploy_aws
  for why the ACM certificate isn't a resource in this template).

Parameters:
  CertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate for Domain, already ISSUED. Requested and validated outside
      CloudFormation by .bin/deploy_aws (in us-east-1, the one region CloudFront can read certs
      from) since DNS validation against Porkbun needs a human step CloudFormation can't pause
      for.

  Domain:
    Type: String

  GcpProjectId:
    Type: String
    Description: >
      The Firebase/GCP project id (see .firebaserc) — server/src/firebase.ts reads this from
      GCLOUD_PROJECT to initialize the Admin SDK; without it, Firestore/Storage/Auth calls would
      target an empty project id in production.

  AssetsBucketName:
    Type: String
    Description: >
      The bookcover repo's public assets bucket (same AWS account), by its actual S3 bucket
      name — not the assets.paper.bible domain fronting it, which the S3 SDK calls in
      lambda_bootstrap.ts can't address. The compile function reads fonts/ and backgrounds/
      from it at cold start. No default here — .bin/deploy_aws is the one place that sets it.

  ImageUri:
    Type: String
    Description: >
      Full ECR image URI:tag for both Lambda functions (one image, split by SERVER_ROLES — see
      server/Dockerfile.lambda). The ECR repository itself isn't a resource here, for the same
      reason the certificate isn't: on a first deploy nothing has been pushed yet, so
      .bin/deploy_aws seeds a placeholder image before this stack is created at all. Real code
      lands via .bin/deploy_api, which redeploys this stack with a new tag.

  PriceClass:
    Type: String
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront edge coverage vs. cost — PriceClass_100 covers North America/Europe.

Resources:

  # --- Static site (S3 + CloudFront) -----------------------------------------------------

  # Private bucket — the app's build output only reaches it via `aws s3 sync` (.bin/deploy_app),
  # and is only ever read through CloudFront (via the OAC below), never directly
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Scoped to this one distribution's ARN, so no other CloudFront distribution (even in this same
  # account) can read the bucket through the OAC
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Replicates firebase.json's header rule verbatim (see CLAUDE.md's CSP section for why each
  # value is what it is) — attached to every cache behavior below, including /api/*, since
  # Firebase Hosting's "**" rule applied to API responses too and Referrer-Policy in particular
  # is called out there as load-bearing, not hygiene. script-src also carries 'unsafe-eval':
  # @myriaddreamin/typst-ts-web-compiler's wasm-bindgen glue calls `new Function(...)` during
  # compiler.init() (js_sys::Function::new_no_args/new_with_args), which 'wasm-unsafe-eval'
  # doesn't cover — that token only permits WebAssembly.compile/instantiate, not JS-string eval.
  # Without it every in-browser compile throws an EvalError before it can render anything.
  # CloudFront rejects Content-Security-Policy,
  # Referrer-Policy, X-Content-Type-Options, X-Frame-Options and Strict-Transport-Security as
  # custom headers (they're reserved, each with a named field under SecurityHeadersConfig
  # instead); Cross-Origin-Opener-Policy and Permissions-Policy have no such field, so those two
  # alone go through CustomHeadersConfig
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          # Guards two things (see CLAUDE.md's CSP section for the reasoning): script injected via
          # a shared design can't run, and nothing the page loads, fetches or frames can reach a
          # host we don't own (so a design can't make its viewers' browsers call an outside
          # server). default-src is the one allowlist every resource type falls back to — images,
          # fetch/XHR, fonts, media and frames alike — and only directives that need something
          # different are pinned separately. The value is a !Join of a list rather than one
          # folded string so each source can carry its own comment and the groups can be spaced
          # apart (a blank line inside a folded string would become a newline in the header).
          # Quoting: CSP keywords like 'self' must be double-quoted to keep their single quotes,
          # and anything ending in a colon (blob:, data:) quoted so YAML doesn't read a map key
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Join
              - ' '
              - - default-src
                - "'self'"  # Bundled images, the walkthrough videos, /api/* (same-origin)
                - 'blob:'  # Preview PDF frame, generated images, custom fonts typst.ts fetches
                # The placeholder page a browser frames instead of a PDF it can't show inline
                # (Android, or Chrome set to download PDFs) — without it that frame is blocked
                # and reported with an empty URL. Also inline SVG images (pattern previews)
                - 'data:'

                # Our own
                - https://assets.paper.bible  # Typst WASM, fonts, cover backgrounds
                - https://cover-widget.paper.bible  # The cover editor (DialogCoverEditor.vue)
                - https://v1.fetch.bible  # Bible translations and book content
                - https://images.freely.giving  # Picture story images + stories.json

                # Third-party
                - https://api.iconify.design  # Icon thumbnails + SVGs fetched for compiles
                - https://api.lulu.com  # Shipping quotes for print cost estimates
                - https://lets.church  # The intro video (IntroVideo.vue)

                # Firebase and Google. Storage is this project's bucket only, by path, so other
                # Firebase projects' files are refused (must match storageBucket in
                # app/src/services/firebase.ts). storage.googleapis.com is where a published
                # PDF frame's range requests sometimes get redirected; CSP ignores the path
                # after a redirect, so its bucket path only constrains direct requests
                - https://firebasestorage.googleapis.com/v0/b/paper-bible.firebasestorage.app/
                - https://storage.googleapis.com/paper-bible.firebasestorage.app/
                - https://firestore.googleapis.com  # Firestore
                - https://identitytoolkit.googleapis.com  # Firebase Auth sign-in
                - https://securetoken.googleapis.com  # Firebase Auth token refresh
                - https://paper-bible.firebaseapp.com  # Firebase Auth's hidden iframe
                - https://apis.google.com  # The sign-in popup's gapi pings (gen_204)

                # Google profile photos on the account button — not the rest of the host, which
                # serves anyone's public images; a photo elsewhere falls back to the icon
                - https://*.googleusercontent.com/a/
                - https://*.googleusercontent.com/a-/;

                # 'wasm-unsafe-eval' + 'unsafe-eval' for the Typst WASM compiler (see above);
                # apis.google.com for Firebase Auth's sign-in popup; 'report-sample' allows
                # nothing, it only puts the start of a blocked inline script in the violation
                # event, so triage can tell an extension's code from an injection attempt
                - "script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'report-sample'
                  https://apis.google.com;"

                # Vuetify's inline styles and the inlined splash CSS
                - "style-src 'self' 'unsafe-inline';"

                # The Typst and cover workers (same-origin chunks, no blob:)
                - "worker-src 'self';"

                # Locked down; frame-ancestors is 'self' not 'none' as Safari applies it to the
                # preview's own blob iframe
                - "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups
            - Header: Permissions-Policy
              Override: true
              Value: >-
                accelerometer=(), bluetooth=(), camera=(), display-capture=(), geolocation=(),
                gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(),
                usb=(), fullscreen=(self "https://lets.church"), autoplay=(self
                "https://lets.church")

  # Two origins (site + api), replicating firebase.json's rewrite order: /api/* is checked first,
  # everything else falls through to the SPA (with a 403->index.html fallback for client routes)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Aliases: [!Ref Domain]
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
          - Id: api
            DomainName: !Select [1, !Split ['://', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingOptimized" — respects the Cache-Control set at sync time
          # (.bin/deploy_app), long-immutable for /assets/**, short for index.html etc
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # AWS managed "CachingDisabled" — every request reaches the API
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS managed "AllViewerExceptHostHeader" — forwards Authorization + the JSON body,
            # which authed_post() (server/src/index.ts) requires
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA fallback for client-side routes — a private bucket via OAC returns 403 (not 404)
        # for a missing key, matching firebase.json's "** -> /index.html" rewrite
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # --- API compute (Lambda + API Gateway) -------------------------------------------------

  # Shared by both functions — CloudFormation only touches resources whose properties actually
  # changed on a given deploy, so one role/one log-group-pair here creates no meaningful blast
  # radius versus splitting further
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt LightLogGroup.Arn
                  - !GetAtt CompileLogGroup.Arn
        - PolicyName: gcp-credentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GcpCredentialsSecret
        # The light function's /api/compile hands accepted compiles to the compile function (see
        # dispatch_compile in server/src/compile.ts). Named rather than !GetAtt, which would make
        # this role and the function that uses it each depend on the other
        - PolicyName: invoke-compile
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub
                  - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Name}'
                  - {Name: !Sub '${AWS::StackName}-compile'}
        # Only the compile function actually calls these (see lambda_bootstrap.ts), but one
        # shared role is simpler than two near-identical ones for a permission this narrow
        - PolicyName: assets-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${AssetsBucketName}'
                Condition:
                  StringLike: {s3:prefix: ['fonts/*', 'backgrounds/*']}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${AssetsBucketName}/fonts/*'
                  - !Sub 'arn:aws:s3:::${AssetsBucketName}/backgrounds/*'

  # GCP service-account key for the Firebase Admin SDK (see server/src/firebase.ts) — the value
  # here is a placeholder only, so CreateSecret has something to create; the real key is set via
  # `aws secretsmanager put-secret-value` (.bin/deploy_aws prints the command) and never passed
  # as a template parameter, which would land it in changeset history
  GcpCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-gcp-credentials'
      Description: >-
        GCP service-account key for the Firebase Admin SDK — set via put-secret-value, not a
        stack parameter. See .bin/deploy_aws.
      SecretString: '{"placeholder": true}'

  LightLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-light'
      RetentionInDays: 30

  CompileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-compile'
      RetentionInDays: 30

  # Every /api route — high call volume, low memory/duration (see server/src/index.ts's 'light'
  # role), including /api/compile, which only checks a compile and hands it to CompileFunction
  LightFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-light'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [server/dist/lambda.handler]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LightLogGroup
      Environment:
        Variables:
          SERVER_ROLES: light
          COMPILE_FUNCTION: !Sub '${AWS::StackName}-compile'
          GCLOUD_PROJECT: !Ref GcpProjectId
          GCP_CREDENTIALS_SECRET_ARN: !Ref GcpCredentialsSecret

  # The compiles /api/compile accepts — the in-browser (WASM) compile fallback + expired-PDF
  # regeneration, not the hot path (most compiles happen client-side). Not behind API Gateway:
  # LightFunction invokes it asynchronously, since a compile can outlast the 30s an HTTP API
  # integration is allowed, and the outcome is recorded on the version doc rather than returned
  CompileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-compile'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [server/dist/lambda.handler]
      MemorySize: 3008
      Timeout: 300
      EphemeralStorage:
        Size: 4096
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref CompileLogGroup
      Environment:
        Variables:
          SERVER_ROLES: compile
          ASSETS_DIR: /tmp/assets
          FONTS_DIR: /tmp/assets/fonts
          TYPST_PATH: /usr/local/bin/typst
          ASSETS_BUCKET: !Ref AssetsBucketName
          GCLOUD_PROJECT: !Ref GcpProjectId
          GCP_CREDENTIALS_SECRET_ARN: !Ref GcpCredentialsSecret

  # Lambda's async invocations: no retries, since the compile records its own failure on the
  # version doc and a retry would only compile it again. Events still queued (the function at
  # its concurrency limit) are dropped after 5 min, so none starts after its version could read as
  # stuck in the app (STUCK_MS) and be retried there — or after the compile lock it was dispatched
  # under has lapsed (COMPILE_LOCK_MS, server/src/quota.ts)
  CompileInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CompileFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 300

  # The HTTP API, which sends every /api route to the light function
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP

  LightIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LightFunction.Arn
      PayloadFormatVersion: '2.0'

  LightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub 'integrations/${LightIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LightInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LightFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: Point Domain's Porkbun ALIAS record here at DNS cutover

  DistributionId:
    Value: !Ref Distribution

  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
    Description: Raw execute-api URL — use this to verify the API standalone before DNS cutover

  SiteBucketName:
    Value: !Ref SiteBucket

  GcpCredentialsSecretArn:
    Value: !Ref GcpCredentialsSecret
    Description: Target for `aws secretsmanager put-secret-value` — see .bin/deploy_aws
