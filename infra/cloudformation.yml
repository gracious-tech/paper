AWSTemplateFormatVersion: '2010-09-09'
Description: >
  paper.bible hosting + API — S3/CloudFront for the static app, Lambda + API Gateway for the
  server (light + compile roles, one container image). Firestore/Auth/Storage stay on Firebase
  — this stack only owns what moved to AWS. Deployed entirely in one region (see .bin/setup_aws
  for why the ACM certificate isn't a resource in this template).

Parameters:
  CertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate for Domain, already ISSUED. Requested and validated outside
      CloudFormation by .bin/setup_aws (in us-east-1, the one region CloudFront can read certs
      from) since DNS validation against Porkbun needs a human step CloudFormation can't pause
      for.

  Domain:
    Type: String

  GcpProjectId:
    Type: String
    Description: >
      The Firebase/GCP project id (see .firebaserc) — server/src/firebase.ts reads this from
      GCLOUD_PROJECT to initialize the Admin SDK; without it, Firestore/Storage/Auth calls would
      target an empty project id in production.

  AssetsBucketName:
    Type: String
    Description: >
      The bookcover repo's public assets bucket (same AWS account), by its actual S3 bucket
      name — not the assets.paper.bible domain fronting it, which the S3 SDK calls in
      lambda_bootstrap.ts can't address. The compile function reads fonts/ and backgrounds/
      from it at cold start. No default here — .bin/setup_aws is the one place that sets it.

  ImageUri:
    Type: String
    Description: >
      Full ECR image URI:tag for both Lambda functions (one image, split by SERVER_ROLES — see
      server/Dockerfile.lambda). The ECR repository itself isn't a resource here, for the same
      reason the certificate isn't: on a first deploy nothing has been pushed yet, so
      .bin/setup_aws seeds a placeholder image before this stack is created at all. Real code
      lands via .bin/deploy_api, which redeploys this stack with a new tag.

  PriceClass:
    Type: String
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront edge coverage vs. cost — PriceClass_100 covers North America/Europe.

Resources:

  # --- Static site (S3 + CloudFront) -----------------------------------------------------

  # Private bucket — the app's build output only reaches it via `aws s3 sync` (.bin/deploy_hosting),
  # and is only ever read through CloudFront (via the OAC below), never directly
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Scoped to this one distribution's ARN, so no other CloudFront distribution (even in this same
  # account) can read the bucket through the OAC
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Replicates firebase.json's header rule verbatim (see CLAUDE.md's CSP section for why each
  # value is what it is) — attached to every cache behavior below, including /api/*, since
  # Firebase Hosting's "**" rule applied to API responses too and Referrer-Policy in particular
  # is called out there as load-bearing, not hygiene. CloudFront rejects Content-Security-Policy,
  # Referrer-Policy, X-Content-Type-Options, X-Frame-Options and Strict-Transport-Security as
  # custom headers (they're reserved, each with a named field under SecurityHeadersConfig
  # instead); Cross-Origin-Opener-Policy and Permissions-Policy have no such field, so those two
  # alone go through CustomHeadersConfig
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self' blob: data: https://assets.paper.bible
              https://firebasestorage.googleapis.com https://images.freely.giving
              https://api.iconify.design https://v1.fetch.bible https://api.lulu.com
              https://firestore.googleapis.com https://identitytoolkit.googleapis.com
              https://securetoken.googleapis.com; script-src 'self' 'wasm-unsafe-eval'
              https://apis.google.com; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:
              https://cover.paper.bible https://lets.church
              https://paper-bible.firebaseapp.com; worker-src 'self'; object-src 'none';
              base-uri 'self'; form-action 'self'; frame-ancestors 'none'
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups
            - Header: Permissions-Policy
              Override: true
              Value: >-
                accelerometer=(), bluetooth=(), camera=(), display-capture=(), geolocation=(),
                gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(),
                usb=(), fullscreen=(self "https://lets.church"), autoplay=(self
                "https://lets.church")

  # Two origins (site + api), replicating firebase.json's rewrite order: /api/* is checked first,
  # everything else falls through to the SPA (with a 403->index.html fallback for client routes)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Aliases: [!Ref Domain]
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
          - Id: api
            DomainName: !Select [1, !Split ['://', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingOptimized" — respects the Cache-Control set at sync time
          # (.bin/deploy_hosting), long-immutable for /assets/**, short for index.html etc
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # AWS managed "CachingDisabled" — every request reaches the API
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS managed "AllViewerExceptHostHeader" — forwards Authorization + the JSON body,
            # which authed_post() (server/src/index.ts) requires
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA fallback for client-side routes — a private bucket via OAC returns 403 (not 404)
        # for a missing key, matching firebase.json's "** -> /index.html" rewrite
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # --- API compute (Lambda + API Gateway) -------------------------------------------------

  # Shared by both functions — CloudFormation only touches resources whose properties actually
  # changed on a given deploy, so one role/one log-group-pair here creates no meaningful blast
  # radius versus splitting further
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt LightLogGroup.Arn
                  - !GetAtt CompileLogGroup.Arn
        - PolicyName: gcp-credentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GcpCredentialsSecret
        # Only the compile function actually calls these (see lambda_bootstrap.ts), but one
        # shared role is simpler than two near-identical ones for a permission this narrow
        - PolicyName: assets-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${AssetsBucketName}'
                Condition:
                  StringLike: {s3:prefix: ['fonts/*', 'backgrounds/*']}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${AssetsBucketName}/fonts/*'
                  - !Sub 'arn:aws:s3:::${AssetsBucketName}/backgrounds/*'

  # GCP service-account key for the Firebase Admin SDK (see server/src/firebase.ts) — the value
  # here is a placeholder only, so CreateSecret has something to create; the real key is set via
  # `aws secretsmanager put-secret-value` (.bin/setup_aws prints the command) and never passed
  # as a template parameter, which would land it in changeset history
  GcpCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-gcp-credentials'
      Description: >-
        GCP service-account key for the Firebase Admin SDK — set via put-secret-value, not a
        stack parameter. See .bin/setup_aws.
      SecretString: '{"placeholder": true}'

  LightLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-light'
      RetentionInDays: 30

  CompileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-compile'
      RetentionInDays: 30

  # The share/redeem/copy/merge routes — high call volume, low memory/duration (see
  # server/src/index.ts's 'light' role)
  LightFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-light'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [server/dist/lambda.handler]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LightLogGroup
      Environment:
        Variables:
          SERVER_ROLES: light
          GCLOUD_PROJECT: !Ref GcpProjectId
          GCP_CREDENTIALS_SECRET_ARN: !Ref GcpCredentialsSecret

  # /api/compile only — the in-browser (WASM) compile fallback + expired-PDF regeneration, not
  # the hot path (most compiles happen client-side). Low traffic, so ReservedConcurrentExecutions
  # caps it as a cost/load guard rather than letting it scale wide
  CompileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-compile'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [server/dist/lambda.handler]
      MemorySize: 3008
      Timeout: 300
      EphemeralStorage:
        Size: 4096
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref CompileLogGroup
      Environment:
        Variables:
          SERVER_ROLES: compile
          ASSETS_DIR: /tmp/assets
          FONTS_DIR: /tmp/assets/fonts
          TYPST_PATH: /usr/local/bin/typst
          ASSETS_BUCKET: !Ref AssetsBucketName
          GCLOUD_PROJECT: !Ref GcpProjectId
          GCP_CREDENTIALS_SECRET_ARN: !Ref GcpCredentialsSecret

  # One HTTP API for both functions — API Gateway's own literal-vs-{proxy+} route precedence
  # gives /api/compile priority over the catch-all, mirroring firebase.json's rewrite order
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP

  CompileIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CompileFunction.Arn
      PayloadFormatVersion: '2.0'

  LightIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LightFunction.Arn
      PayloadFormatVersion: '2.0'

  CompileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/compile
      Target: !Sub 'integrations/${CompileIntegration}'

  LightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub 'integrations/${LightIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  CompileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CompileFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  LightInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LightFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: Point Domain's Porkbun ALIAS record here at DNS cutover

  DistributionId:
    Value: !Ref Distribution

  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
    Description: Raw execute-api URL — use this to verify the API standalone before DNS cutover

  SiteBucketName:
    Value: !Ref SiteBucket

  GcpCredentialsSecretArn:
    Value: !Ref GcpCredentialsSecret
    Description: Target for `aws secretsmanager put-secret-value` — see .bin/setup_aws
